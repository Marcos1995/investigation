<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4–8 diciembre 2026</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --ink: #17202a; --mute: #5a6570; --line: #e4d8c8; --paper: #f3ebe0;
      --card: #fffcf7; --sea: #1f4e68; --clay: #c24b1f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.4; }
    .bar {
      position: sticky; top: 0; z-index: 2000;
      display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap;
      padding: .65rem 1.1rem; background: #efe6d8; border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 800; font-size: 1.05rem; }
    .langs { display: flex; gap: .3rem; }
    button.pill, a.btn {
      font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--line);
      background: var(--card); color: var(--ink); padding: .3rem .7rem;
    }
    button.pill[aria-pressed="true"] { background: var(--sea); color: #fff; border-color: var(--sea); }
    a.btn { text-decoration: none; background: var(--ink); color: #fff; border: 0; display: inline-block; border-radius: 8px; padding: .42rem .72rem; }
    a.btn.alt { background: var(--sea); }
    a.btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .wrap { max-width: 74rem; margin: 0 auto; padding: .85rem 1.1rem 1.6rem; }
    h1 { font-family: Georgia, serif; font-size: clamp(1.35rem, 2.6vw, 1.85rem); margin: 0 0 .35rem; font-weight: 600; }
    .lead { max-width: 46rem; margin: 0 0 .7rem; font-size: .98rem; }
    .lead b { color: var(--clay); }
    .mapbox { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    #map { height: 240px; width: 100%; }
    .legend { font-size: .78rem; color: var(--mute); padding: .4rem .7rem; display: flex; flex-wrap: wrap; align-items: center; gap: .45rem; }
    .legend i { display: inline-block; width: .65rem; height: .65rem; border-radius: 50%; margin: 0 .25rem 0 .5rem; vertical-align: -1px; }
    .cities { display: grid; grid-template-columns: repeat(5, 1fr); gap: .45rem; margin: .75rem 0 .8rem; }
    .city {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: .55rem .6rem; cursor: pointer; text-align: left;
    }
    .city.on { outline: 2px solid var(--clay); }
    .city b { display: block; }
    .city span { color: var(--mute); font-size: .8rem; }
    .city .p { color: var(--clay); font-weight: 750; font-size: .92rem; }
    .sbtn { display: flex; flex-wrap: wrap; gap: .28rem; margin-top: .45rem; }
    .sbtn a {
      font-size: .72rem; padding: .28rem .45rem; border-radius: 7px; text-decoration: none;
      background: var(--sea); color: #fff; font-weight: 650;
    }
    .sbtn a.on { background: var(--clay); }
    .sbtn a.miss { opacity: .55; }
    .hint { color: var(--mute); font-size: .8rem; margin: -.1rem 0 .75rem; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: .9rem 1rem; }
    .k { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--clay); font-weight: 700; }
    .why { color: var(--mute); margin: .25rem 0 .55rem; }
    .leg { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .7rem; margin: .4rem 0; }
    .leg h3 { margin: 0 0 .35rem; font-size: .92rem; }
    .pair { display: grid; grid-template-columns: 1fr; gap: .4rem; }
    .fly { background: #f7f1e8; border-radius: 8px; padding: .45rem .5rem; font-size: .84rem; }
    .fly b { display: block; font-size: .74rem; color: var(--mute); }
    .times { font-weight: 750; margin: .1rem 0; }
    .price { color: var(--clay); font-weight: 750; }
    .pin { background: var(--clay); color: #fff; border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; font-size: 10px; font-weight: 800; border: 2px solid #fff; }
    .pin.origin { background: var(--sea); }
    .pin.on { transform: scale(1.12); }
    footer { max-width: 74rem; margin: 0 auto; padding: 0 1.1rem 1.4rem; color: var(--mute); font-size: .8rem; }
    footer a { color: inherit; }
    @media (max-width: 900px) {
      .cities { grid-template-columns: 1fr 1fr; }
      #map { height: 220px; }
    }
    @media (min-width: 901px) {
      .pair { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) { .cities { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="bar">
    <div class="brand" id="dates"></div>
    <div class="langs">
      <button class="pill" type="button" data-lang="es">ES</button>
      <button class="pill" type="button" data-lang="en">EN</button>
      <button class="pill" type="button" data-lang="de">DE</button>
    </div>
  </div>
  <div class="wrap">
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="mapbox">
      <div id="map"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="cities" id="list"></div>
    <p class="hint" id="stayhint"></p>
    <div class="panel" id="detail"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const T = {
      es: {
        dates: "4–8 de diciembre de 2026",
        title: "Un puente de 4 noches para 6 personas",
        lead: "Del <b>viernes 4</b> al <b>martes 8 de diciembre de 2026</b>. 2 desde Barcelona (BCN), 2 desde Frankfurt (FRA) y 2 desde Hamburgo (HAM). Solo <b>directos</b>: ida <b>a partir de las 17:00–18:00</b> (no antes), vuelta a mediodía o tarde. El precio del vuelo ya incluye maleta de cabina (~8 kg). Pulsa una ciudad.",
        mapO: "Salís de aquí", mapD: "Destinos",
        whyL: "Por qué", each: "por persona", out: "Ida 4 dic", back: "Vuelta 8 dic",
        dep: "Sale", arr: "Aterriza", dur: "en el aire", pax: "2 personas",
        stay: "Piso: 3 habitaciones y 2+ baños (el baño puede estar fuera). Hotel: 3 habitaciones, cama doble o dos individuales, baño dentro de cada una.",
        nights: "/noche · ",
        ab: "Piso Airbnb", apt: "Piso Booking", ht: "Hotel",
        zero: "sin listados",
        gf: "Google Flights", air: "Aerolínea", bag: "cabina 8 kg incluida"
      },
      en: {
        dates: "4–8 December 2026",
        title: "A 4-night trip for 6 people",
        lead: "From <b>Friday 4</b> to <b>Tuesday 8 December 2026</b>. 2 from Barcelona (BCN), 2 from Frankfurt (FRA), 2 from Hamburg (HAM). <b>Direct</b> only: out <b>from 17:00–18:00</b> (not earlier), back midday or afternoon. Fares include a cabin bag (~8 kg). Tap a city.",
        mapO: "You leave from here", mapD: "Destinations",
        whyL: "Why", each: "per person", out: "Out 4 Dec", back: "Return 8 Dec",
        dep: "Departs", arr: "Lands", dur: "air time", pax: "2 people",
        stay: "Flat: 3 bedrooms and 2+ baths (bath need not be en suite). Hotel: 3 rooms, double or twin beds, private bathroom in each room.",
        nights: "/night · ",
        ab: "Airbnb flat", apt: "Booking flat", ht: "Hotel",
        zero: "no listings",
        gf: "Google Flights", air: "Airline", bag: "8 kg cabin bag included"
      },
      de: {
        dates: "4.–8. Dezember 2026",
        title: "Vier Nächte für sechs Personen",
        lead: "Von <b>Freitag 4.</b> bis <b>Dienstag 8. Dezember 2026</b>. 2 ab Barcelona (BCN), 2 ab Frankfurt (FRA), 2 ab Hamburg (HAM). Nur <b>Direktflüge</b>: hin <b>ab 17:00–18:00</b> (nicht früher), zurück mittags oder nachmittags. Preis inkl. Handgepäck (~8 kg). Stadt antippen.",
        mapO: "Abflug", mapD: "Ziele",
        whyL: "Warum", each: "pro Person", out: "Hin 4. Dez", back: "Rück 8. Dez",
        dep: "Start", arr: "Landung", dur: "Flugzeit", pax: "2 Personen",
        stay: "Wohnung: 3 Schlafzimmer und 2+ Bäder (Bad muss nicht im Zimmer sein). Hotel: 3 Zimmer, Doppel- oder zwei Einzelbetten, Bad im Zimmer.",
        nights: "/Nacht · ",
        ab: "Airbnb-Wohnung", apt: "Booking-Wohnung", ht: "Hotel",
        zero: "keine Treffer",
        gf: "Google Flights", air: "Airline", bag: "8-kg-Handgepäck inklusive"
      }
    };

    const CITIES = [
      {
        id: "LIS", iata: "LIS", rank: 1, ll: [38.7308, -9.1485], max: 250,
        name: { es: "Lisboa", en: "Lisbon", de: "Lissabon" },
        t: "15–17 °C",
        why: {
          es: "Mejor equilibrio. Zona: Saldanha / metro Parque — segura, no es cara de lujo, y con metro a todo Lisboa. Alfama es más de postal, pero no tiene metro y es menos práctica para 6.",
          en: "Best balance. Area: Saldanha / Parque metro — safe, not luxury-priced, metro to the whole city. Alfama is prettier on postcards but has no metro and is awkward for 6.",
          de: "Beste Balance. Viertel: Saldanha / Metro Parque — sicher, nicht luxuriös, Metro durch ganz Lissabon. Alfama ist postkartenhafter, aber ohne Metro und unpraktisch für 6."
        },
        area: { es: "Saldanha · metro Parque", en: "Saldanha · Parque metro", de: "Saldanha · Metro Parque" },
        food: 190, metro: 20, stay: { airbnb: 800, apt: 760, hotel: 960 },
        q: { airbnb: "Lisbon--Portugal", ss: "Lisbon", dest: "-2167973" },
        flights: {
          BCN: { air: "Vueling", p: 155, out: ["19:20", "20:25", "1h 55m"], back: ["14:05", "17:05", "2h 00m"] },
          FRA: { air: "TAP", p: 200, out: ["17:45", "20:00", "3h 15m"], back: ["12:15", "16:25", "3h 10m"] },
          HAM: { air: "TAP", p: 195, out: ["17:00", "19:35", "3h 35m"], back: ["11:20", "16:50", "3h 30m"] }
        }
      },
      {
        id: "PMI", iata: "PMI", rank: 2, ll: [39.5696, 2.6502], max: 180,
        name: { es: "Palma", en: "Palma", de: "Palma" },
        t: "16–18 °C",
        why: {
          es: "La más cálida y con tardes directas fáciles desde HAM. Casco antiguo a pie; bus/metro al aeropuerto.",
          en: "Warmest, with easy evening directs from HAM. Walkable old town; bus to the airport.",
          de: "Am wärmsten, abends gut erreichbar ab HAM. Altstadt zu Fuß; Bus zum Flughafen."
        },
        area: { es: "Casco antiguo · Plaça Major", en: "Old town · Plaça Major", de: "Altstadt · Plaça Major" },
        food: 185, metro: 12, stay: { airbnb: 640, apt: 600, hotel: 780 },
        q: { airbnb: "Palma--Spain", ss: "Palma de Mallorca", dest: "-395224" },
        flights: {
          BCN: { air: "Vueling", p: 120, out: ["18:30", "19:30", "1h 00m"], back: ["12:35", "13:35", "1h 00m"] },
          FRA: { air: "Eurowings", p: 155, out: ["17:30", "19:50", "2h 20m"], back: ["13:00", "15:15", "2h 15m"] },
          HAM: { air: "Eurowings", p: 150, out: ["17:15", "20:00", "2h 45m"], back: ["12:20", "14:50", "2h 30m"] }
        }
      },
      {
        id: "MAD", iata: "MAD", rank: 3, ll: [40.4168, -3.7038], max: 300,
        name: { es: "Madrid", en: "Madrid", de: "Madrid" },
        t: "11–13 °C",
        why: {
          es: "Mucho que ver. Sol / Gran Vía con metro. Iberia HAM sale ~19:50 (cabina incluida).",
          en: "Lots to see. Sol / Gran Vía on the metro. Iberia from HAM ~19:50 (cabin bag included).",
          de: "Viel Stadt. Sol / Gran Vía an der Metro. Iberia ab HAM ~19:50 (Handgepäck inklusive)."
        },
        area: { es: "Sol · Gran Vía · metro", en: "Sol · Gran Vía · metro", de: "Sol · Gran Vía · Metro" },
        food: 200, metro: 18, stay: { airbnb: 1000, apt: 920, hotel: 1240 },
        q: { airbnb: "Madrid--Spain", ss: "Madrid", dest: "-390625" },
        flights: {
          BCN: { air: "Vueling", p: 130, out: ["18:00", "19:25", "1h 25m"], back: ["13:00", "14:20", "1h 20m"] },
          FRA: { air: "Lufthansa", p: 175, out: ["18:00", "20:30", "2h 30m"], back: ["13:15", "15:40", "2h 25m"] },
          HAM: { air: "Iberia", p: 190, out: ["19:50", "22:35", "2h 45m"], back: ["12:40", "15:20", "2h 40m"] }
        }
      },
      {
        id: "FCO", iata: "FCO", rank: 4, ll: [41.8986, 12.4768], max: 260,
        name: { es: "Roma", en: "Rome", de: "Rom" },
        t: "12–14 °C",
        why: {
          es: "La que más ofrece. Centro histórico; metro Spagna. El 8 es festivo. HAM Eurowings ~17:00.",
          en: "Most to see. Historic centre; Spagna metro. 8 Dec is a holiday. HAM Eurowings ~17:00.",
          de: "Am meisten Stadt. Historisches Zentrum; Metro Spagna. 8. Dez. Feiertag. HAM Eurowings ~17:00."
        },
        area: { es: "Centro histórico · Panteón", en: "Historic centre · Pantheon", de: "Historisches Zentrum · Pantheon" },
        food: 235, metro: 25, stay: { airbnb: 1040, apt: 980, hotel: 1280 },
        q: { airbnb: "Rome--Italy", ss: "Rome", dest: "-126693" },
        flights: {
          BCN: { air: "Vueling", p: 160, out: ["18:55", "20:45", "1h 50m"], back: ["13:20", "15:15", "1h 55m"] },
          FRA: { air: "Lufthansa", p: 185, out: ["18:10", "20:00", "1h 50m"], back: ["12:00", "14:00", "2h 00m"] },
          HAM: { air: "Eurowings", p: 175, out: ["17:00", "19:15", "2h 15m"], back: ["12:40", "15:00", "2h 20m"] }
        }
      },
      {
        id: "MXP", iata: "MXP", rank: 5, ll: [45.4642, 9.1900], max: 220,
        name: { es: "Milán", en: "Milan", de: "Mailand" },
        t: "7–10 °C",
        why: {
          es: "Directos de tarde desde las tres. Duomo en metro. Más fría que Lisboa o Palma.",
          en: "Evening directs from all three. Duomo on the metro. Colder than Lisbon or Palma.",
          de: "Abend-Direktflüge ab allen dreien. Dom per Metro. Kälter als Lissabon oder Palma."
        },
        area: { es: "Duomo · metro", en: "Duomo · metro", de: "Dom · Metro" },
        food: 220, metro: 20, stay: { airbnb: 880, apt: 840, hotel: 1100 },
        q: { airbnb: "Milan--Italy", ss: "Milan", dest: "-121726" },
        flights: {
          BCN: { air: "Vueling", p: 140, out: ["18:20", "19:50", "1h 30m"], back: ["13:10", "14:40", "1h 30m"] },
          FRA: { air: "Lufthansa", p: 170, out: ["17:15", "18:25", "1h 10m"], back: ["12:30", "13:45", "1h 15m"] },
          HAM: { air: "Eurowings", p: 165, out: ["17:10", "18:50", "1h 40m"], back: ["13:00", "14:40", "1h 40m"] }
        }
      }
    ];

    const ORIGIN = {
      BCN: { ll: [41.2974, 2.0833] },
      FRA: { ll: [50.0379, 8.5622] },
      HAM: { ll: [53.6304, 9.9882] }
    };

    const hl = { es: "es", en: "en", de: "de" };
    let lang = localStorage.getItem("trip-lang") || "es";
    let sel = "LIS";
    let stay = "airbnb";
    let map, overlay;

    const pp = (c, o) => c.flights[o].p + Math.round(c.stay[stay] / 6) + c.food + c.metro;
    const city = () => CITIES.find((c) => c.id === sel);

    function gf(from, to) {
      return "https://www.google.com/travel/flights?hl=" + hl[lang] + "&curr=EUR#flt=" +
        from + "." + to + ".2026-12-04*" + to + "." + from + ".2026-12-08";
    }
    function airlineUrl(air, from, to) {
      if (air === "Vueling")
        return "https://tickets.vueling.com/ScheduleSelectNew.aspx?o=" + from + "&d=" + to + "&dd=2026-12-04&rd=2026-12-08&ADT=2&CURRENCY=EUR";
      if (air === "Lufthansa") {
        const loc = lang === "de" ? "de/de" : lang === "en" ? "en/en" : "es/es";
        return "https://www.lufthansa.com/" + loc + "/booking/flight-search?origin=" + from + "&destination=" + to + "&outboundDate=2026-12-04&inboundDate=2026-12-08&adults=2&tripType=ROUNDTRIP";
      }
      if (air === "TAP")
        return "https://booking.flytap.com/?tripType=RT&origin=" + from + "&destination=" + to + "&departureDate=2026-12-04&returnDate=2026-12-08&adults=2";
      if (air === "Eurowings") {
        const loc = lang === "de" ? "de" : lang === "en" ? "en" : "es";
        return "https://www.eurowings.com/" + loc + "/booking/flights/search.html?origin=" + from + "&destination=" + to + "&outboundDate=2026-12-04&inboundDate=2026-12-08&adultCount=2";
      }
      if (air === "Iberia")
        return "https://www.iberia.com/" + (lang === "de" ? "de" : lang === "en" ? "gb" : "es") + "/flights/?origin=" + from + "&destination=" + to + "&outbound=" + "2026-12-04&inbound=2026-12-08&adults=2";
      return "https://en.aegeanair.com/plan/book/?from=" + from + "&to=" + to + "&departure=2026-12-04&return=2026-12-08&adults=2";
    }
    function stayUrls(c) {
      const max = c.max;
      const hmax = Math.round(c.max * 1.5 + 50);
      const ab = (lang === "de" ? "https://www.airbnb.de" : lang === "en" ? "https://www.airbnb.com" : "https://www.airbnb.es") +
        "/s/" + c.q.airbnb + "/homes?checkin=2026-12-04&checkout=2026-12-08&adults=6&min_bedrooms=3&min_beds=3&min_bathrooms=2&room_types%5B%5D=Entire%20home%2Fapt&price_max=" + max;
      const page = lang === "de" ? "de.html" : lang === "en" ? "html" : "es.html";
      const occ = "&checkin=2026-12-04&checkout=2026-12-08&group_adults=6&req_adults=6&no_rooms=3&req_rooms=3&group_children=0&req_children=0&selected_currency=EUR";
      const where = "?ss=" + encodeURIComponent(c.q.ss) + "&dest_id=" + c.q.dest + "&dest_type=city" + occ;
      const nfltApt = "ht_id%3D201%3Bht_id%3D220%3Bht_id%3D206%3Bprice%3DEUR-40-" + max + "-1";
      const nfltHt = "ht_id%3D204%3Broomfacility%3D38%3Bprice%3DEUR-40-" + hmax + "-1";
      const apt = "https://www.booking.com/searchresults." + page + where + "&nflt=" + nfltApt + "&order=homes_apartments_first";
      const ht = "https://www.booking.com/searchresults." + page + where + "&nflt=" + nfltHt;
      return { airbnb: ab, apt: apt, hotel: ht };
    }

    function pinIcon(txt, origin, on) {
      return L.divIcon({
        className: "",
        html: "<div class=\"pin" + (origin ? " origin" : "") + (on ? " on" : "") + "\">" + txt + "</div>",
        iconSize: [28, 28], iconAnchor: [14, 14]
      });
    }
    function ensureMap() {
      if (map) return;
      map = L.map("map", { scrollWheelZoom: true }).setView([46.2, 8], 4);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "&copy; OpenStreetMap" }).addTo(map);
      overlay = L.layerGroup().addTo(map);
      const pts = Object.values(ORIGIN).map((o) => o.ll).concat(CITIES.map((c) => c.ll));
      map.fitBounds(pts, { padding: [28, 28], maxZoom: 5 });
    }
    function drawMap() {
      ensureMap();
      overlay.clearLayers();
      const dest = city();
      Object.keys(ORIGIN).forEach((k) => {
        L.marker(ORIGIN[k].ll, { icon: pinIcon(k, true, false) }).addTo(overlay).bindTooltip(k);
        L.polyline([ORIGIN[k].ll, dest.ll], { color: "#c24b1f", weight: 2, opacity: .7, dashArray: "6 6" }).addTo(overlay);
      });
      CITIES.forEach((c) => {
        L.marker(c.ll, { icon: pinIcon(c.iata, false, c.id === sel) })
          .addTo(overlay).bindTooltip(c.name[lang])
          .on("click", () => { sel = c.id; render(); });
      });
      setTimeout(() => map.invalidateSize(), 80);
    }

    function flyBlock(c, o, t) {
      const f = c.flights[o];
      return "<div class=\"leg\"><h3>" + t.pax + " " + o + " · " + f.air + " · <span class=\"price\">" + f.p + " € " + t.each + "</span> · " + t.bag + "</h3>" +
        "<div class=\"pair\"><div class=\"fly\"><b>" + t.out + "</b><div class=\"times\">" + f.out[0] + " " + o + " → " + f.out[1] + " " + c.iata + "</div>" +
        t.dep + " " + f.out[0] + " · " + t.arr + " " + f.out[1] + " · " + f.out[2] + "</div>" +
        "<div class=\"fly\"><b>" + t.back + "</b><div class=\"times\">" + f.back[0] + " " + c.iata + " → " + f.back[1] + " " + o + "</div>" +
        t.dep + " " + f.back[0] + " · " + t.arr + " " + f.back[1] + " · " + f.back[2] + "</div></div>" +
        "<div style=\"margin-top:.4rem;display:flex;gap:.35rem;flex-wrap:wrap\">" +
        "<a class=\"btn\" target=\"_blank\" rel=\"noopener\" href=\"" + gf(o, c.iata) + "\">" + t.gf + "</a>" +
        "<a class=\"btn ghost\" target=\"_blank\" rel=\"noopener\" href=\"" + airlineUrl(f.air, o, c.iata) + "\">" + t.air + " " + f.air + "</a></div></div>";
    }

    function render() {
      const t = T[lang];
      const c = city();
      document.documentElement.lang = lang;
      document.title = t.dates;
      document.getElementById("dates").textContent = t.dates;
      document.getElementById("title").textContent = t.title;
      document.getElementById("lead").innerHTML = t.lead;
      document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
      document.getElementById("legend").innerHTML =
        "<span><i style=\"background:#1f4e68\"></i>" + t.mapO + "<i style=\"background:#c24b1f\"></i>" + t.mapD + "</span>";
      document.getElementById("stayhint").textContent = t.stay;

      document.getElementById("list").innerHTML = CITIES.map((x) => {
        const u = stayUrls(x);
        const btn = (kind, label) => {
          const miss = x.empty && x.empty[kind];
          return "<a class=\"" + (stay === kind ? "on" : "") + (miss ? " miss" : "") + "\" data-stay=\"" + kind +
            "\" data-city=\"" + x.id + "\" target=\"_blank\" rel=\"noopener\" href=\"" + u[kind] + "\"" +
            (miss ? " title=\"" + t.zero + "\"" : "") + ">" + label + (miss ? " · " + t.zero : "") + "</a>";
        };
        return "<div class=\"city" + (x.id === sel ? " on" : "") + "\" data-id=\"" + x.id + "\">" +
        "<b>#" + x.rank + " " + x.name[lang] + "</b><span>" + x.t + " · " + x.area[lang] + "</span>" +
        "<div class=\"p\">" + pp(x, "BCN") + "–" + pp(x, "FRA") + " € " + t.each + "</div>" +
        "<div class=\"sbtn\">" + btn("airbnb", t.ab) + btn("apt", t.apt) + btn("hotel", t.ht) + "</div></div>";
      }).join("");

      document.getElementById("detail").innerHTML =
        "<div class=\"k\">#" + c.rank + "</div>" +
        "<h2 style=\"margin:.1rem 0;font-family:Georgia,serif\">" + c.name[lang] + "</h2>" +
        "<p class=\"why\"><strong>" + t.whyL + ":</strong> " + c.why[lang] + "</p>" +
        ["BCN", "FRA", "HAM"].map((o) => flyBlock(c, o, t)).join("");

      document.querySelectorAll(".city").forEach((el) => el.onclick = () => { sel = el.dataset.id; render(); });
      document.querySelectorAll(".sbtn a").forEach((a) => {
        a.onclick = (e) => {
          e.stopPropagation();
          stay = a.dataset.stay;
          sel = a.dataset.city;
          setTimeout(render, 0);
        };
      });
      drawMap();
    }

    document.querySelectorAll("[data-lang]").forEach((b) => {
      b.onclick = () => { lang = b.dataset.lang; localStorage.setItem("trip-lang", lang); render(); };
    });
    render();
  </script>
</body>
</html>
