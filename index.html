    :root {
      --ink: #17202a; --mute: #5a6570; --line: #e4d8c8; --paper: #f3ebe0;
      --card: #fffcf7; --sea: #1f4e68; --clay: #c24b1f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.4; }
    .bar {
      position: sticky; top: 0; z-index: 2000;
      display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap;
      padding: .65rem 1.1rem; background: #efe6d8; border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 800; font-size: 1.05rem; }
    .langs { display: flex; gap: .3rem; }
    button.pill, a.btn {
      font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--line);
      background: var(--card); color: var(--ink); padding: .3rem .7rem;
    }
    button.pill[aria-pressed="true"] { background: var(--sea); color: #fff; border-color: var(--sea); }
    a.btn { text-decoration: none; background: var(--ink); color: #fff; border: 0; display: inline-block; border-radius: 8px; padding: .42rem .72rem; }
    a.btn.alt { background: var(--sea); }
    a.btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .wrap { max-width: 74rem; margin: 0 auto; padding: .85rem 1.1rem 1.6rem; }
    h1 { font-family: Georgia, serif; font-size: clamp(1.35rem, 2.6vw, 1.85rem); margin: 0 0 .35rem; font-weight: 600; }
    .lead { max-width: 46rem; margin: 0 0 .7rem; font-size: .98rem; }
    .lead b { color: var(--clay); }
    .mapbox { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    #map { height: 280px; width: 100%; }
    .legend { font-size: .78rem; color: var(--mute); padding: .4rem .7rem; display: flex; flex-wrap: wrap; align-items: center; gap: .45rem; }
    .legend i { display: inline-block; width: .65rem; height: .65rem; border-radius: 50%; margin: 0 .25rem 0 .5rem; vertical-align: -1px; }
    .cities { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; margin: .75rem 0 .8rem; }
    .city {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: .7rem .75rem; cursor: pointer; text-align: left;
    }
    .city.on { outline: 2px solid var(--clay); }
    .city.open { grid-column: 1 / -1; }
    .city > b { display: block; }
    .city > span { color: var(--mute); font-size: .8rem; }
    .city .p {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: .12rem .35rem;
      color: var(--clay); font-weight: 800; font-size: 1.18rem; letter-spacing: -.02em;
      margin: .2rem 0 .08rem;
    }
    .city .p small { font-weight: 650; font-size: .72rem; color: var(--mute); letter-spacing: 0; }
    .city .p .vary {
      font-size: .65rem; font-weight: 750; color: #8a3414;
      background: #f3d9cc; border-radius: 999px; padding: .1rem .42rem;
    }
    .city .grp { color: var(--mute); font-size: .78rem; font-weight: 650; margin: 0 0 .1rem; }
    .city .grp b { color: var(--ink); font-weight: 750; }
    .city .brk {
      display: flex; flex-wrap: wrap; gap: .28rem .55rem;
      color: var(--mute); font-size: .75rem; margin: .05rem 0 .15rem;
      padding-top: .4rem; border-top: 1px solid var(--line);
    }
    .city .brk b { color: var(--ink); font-weight: 750; }
    .city .brk em, .split em {
      font-style: italic; font-weight: 550; color: var(--mute); font-size: .7rem;
    }
    .split {
      display: grid; gap: .45rem; font-size: .84rem; margin: 0 0 .55rem;
    }
    .split .bill {
      background: #f7f1e8; border-radius: 10px; padding: .45rem .6rem .5rem;
    }
    .split .bill .o {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: .15rem .4rem;
      font-weight: 800; color: var(--sea); font-size: .82rem; margin-bottom: .18rem;
    }
    .split .bill .o small { font-weight: 650; font-size: .7rem; color: var(--mute); }
    .split .line {
      display: grid; grid-template-columns: 1fr auto; gap: .4rem; align-items: baseline;
      padding: .06rem 0;
    }
    .split .line b { color: var(--ink); font-weight: 650; }
    .split hr {
      border: 0; border-top: 1px solid var(--line); margin: .2rem 0 .12rem;
    }
    .split .totline span { font-weight: 750; }
    .split .totline strong { color: var(--clay); font-weight: 800; font-size: 1.05rem; }
    .split em {
      font-style: italic; font-weight: 550; color: var(--mute); font-size: .7rem;
    }
    .sbtn { display: flex; flex-wrap: wrap; gap: .28rem; margin-top: .45rem; }
    .sbtn a {
      display: inline-flex; flex-direction: row; align-items: baseline; gap: .35rem;
      font-size: .72rem; padding: .32rem .5rem; border-radius: 7px; text-decoration: none;
      background: var(--sea); color: #fff; font-weight: 650; line-height: 1.2;
    }
    .sbtn a .from { font-size: .72rem; font-weight: 800; opacity: 1; }
    .sbtn a.on { background: var(--clay); }
    .sbtn a.miss { opacity: .55; }
    .tog {
      margin-top: .4rem; width: 100%; font: inherit; font-size: .72rem; font-weight: 650;
      cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 7px; padding: .28rem .45rem;
    }
    .city.open .tog { background: var(--sea); color: #fff; border-color: var(--sea); }
    .more { margin-top: .5rem; border-top: 1px solid var(--line); padding-top: .5rem; }
    .more .why { color: var(--mute); font-size: .84rem; margin: 0 0 .45rem; }
    .rowf {
      display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto; gap: .3rem .7rem;
      align-items: start; font-size: .82rem; background: #f7f1e8; border-radius: 8px;
      padding: .45rem .55rem; margin: 0 0 .32rem;
    }
    .rowf .o { font-weight: 800; color: var(--sea); padding-top: .12rem; }
    .rowf .meta { color: var(--mute); font-size: .78rem; margin-bottom: .18rem; }
    .rowf .leg { font-weight: 650; line-height: 1.45; }
    .rowf .leg em { font-style: normal; font-weight: 750; color: var(--mute); font-size: .72rem; margin-right: .35rem; }
    .rowf .btns { display: flex; gap: .28rem; flex-wrap: wrap; padding-top: .1rem; }
    .rowf .btn { padding: .22rem .48rem; font-size: .7rem; border-radius: 7px; }
    .hint { color: var(--mute); font-size: .8rem; margin: -.1rem 0 .75rem; }
    .budget { display: grid; grid-template-columns: 1fr; gap: .55rem; margin: .7rem 0 0; max-width: 28rem; }
    .budget label {
      display: block; font-size: .8rem; color: var(--mute);
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: .7rem .75rem;
    }
    .budget b { color: var(--clay); font-weight: 750; }
    .budget input[type="range"] { width: 100%; margin-top: .25rem; accent-color: var(--sea); }
    @media (max-width: 560px) { .budget { grid-template-columns: 1fr; } }
    .price { color: var(--clay); font-weight: 750; }
    .pin { background: var(--clay); color: #fff; border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; font-size: 10px; font-weight: 800; border: 2px solid #fff; }
    .pin.origin { background: var(--sea); }
    .pin.on { transform: scale(1.12); }
    footer { max-width: 74rem; margin: 0 auto; padding: 0 1.1rem 1.6rem; color: var(--mute); font-size: .8rem; }
    footer b { color: var(--ink); font-weight: 700; }
    @media (max-width: 700px) {
      #map { height: 220px; }
      .rowf { grid-template-columns: 3.4rem 1fr; }
      .rowf .btns { grid-column: 1 / -1; }
    }
    @media (max-width: 560px) { .cities { grid-template-columns: 1fr; } }
  </style>

      {

        t: "11–13 °C",
        why: {

          en: "Lots to see. Sol / Gran Vía on the metro. Hotel (922 €) beats the flat: down to #8. Vueling and Iberia charge for cabin bag and seats.",
          de: "Viel Stadt. Sol / Gran Vía an der Metro. Hotel (922 €) schlägt die Wohnung: auf #8. Vueling und Iberia nehmen extra für Handgepäck und Sitze.",
        },
        area: { es: "Sol · Gran Vía · metro", en: "Sol · Gran Vía · metro", de: "Sol · Gran Vía · Metro" },
        q: { airbnb: "Madrid--Spain", ss: "Madrid", dest: "-390625", bb: [40.400, -3.725, 40.440, -3.680] },
        flights: {
          BCN: { air: "Vueling", p: 110, out: ["16:30", "17:55", "1h 25m"], back: ["19:35", "20:55", "1h 20m"] },
          FRA: { air: "Lufthansa", p: 180, out: ["21:15", "23:55", "2h 40m"], back: ["17:15", "19:45", "2h 30m"] },
          HAM: { air: "Iberia", p: 300, out: ["15:50", "18:55", "3h 05m"], back: ["19:45", "22:40", "2h 55m"] }

    const ORIGIN = {
      BCN: { ll: [41.2974, 2.0833], name: { es: "Barcelona", en: "Barcelona", de: "Barcelona" } },
      FRA: { ll: [50.0379, 8.5622], name: { es: "Frankfurt", en: "Frankfurt", de: "Frankfurt" } },
      HAM: { ll: [53.6304, 9.9882], name: { es: "Hamburgo", en: "Hamburg", de: "Hamburg" } }
    };

    function langFromUrl() {
      const q = new URLSearchParams(location.search).get("lang");
      return q === "es" || q === "en" || q === "de" ? q : "de";
    }
    function setLangUrl(code) {
      const u = new URL(location.href);
      u.searchParams.set("lang", code);
      history.replaceState(null, "", u.pathname + u.search + u.hash);
    }
    let lang = langFromUrl();
    setLangUrl(lang);
    let sel = "ATH";
    let open = "";
    let foodDay = 40;
    let map, overlay;
    const NIGHTS = 4;
    const AIR = { Vueling: "VY", TAP: "TP", Eurowings: "EW", Lufthansa: "LH", Iberia: "IB", "Air Europa": "UX", easyJet: "U2", Condor: "DE", ITA: "AZ", "Wizz Air": "W6", Ryanair: "FR", Aegean: "A3", "SKY express": "GQ", Austrian: "OS", LOT: "LO", "Air France": "AF", "British Airways": "BA" };
    const BAG_RT = { "Wizz Air": 64, Ryanair: 56, easyJet: 64, Vueling: 56, Eurowings: 44, Iberia: 50, Condor: 44 };
    const SEAT_RT = { "Wizz Air": 18, Ryanair: 18, easyJet: 16, Vueling: 16, Eurowings: 18, Iberia: 20, Condor: 16 };
    const flyP = (f) => f.p + (BAG_RT[f.air] || 0) + (SEAT_RT[f.air] || 0);

    const stayCost = (c) => Math.min(c.stay, c.hotel);
    const bedOf = (c) => Math.round(stayCost(c) / 6);
    const pp = (c, o) => flyP(c.flights[o]) + bedOf(c) + foodDay * NIGHTS;
    const groupOf = (c) => 2 * ["BCN", "FRA", "HAM"].reduce((s, o) => s + flyP(c.flights[o]), 0)
      + stayCost(c) + foodDay * NIGHTS * 6;
    const city = () => CITIES.find((c) => c.id === sel);

    function uvar(n) {
      const o = [];
      while (n > 127) { o.push((n & 127) | 128); n = Math.floor(n / 128); }
      o.push(n);
      return o;
    }
    function tag(f, w) { return uvar((f << 3) | w); }
    function fVar(f, n) { return tag(f, 0).concat(uvar(n)); }
    function fBytes(f, arr) { return tag(f, 2).concat(uvar(arr.length)).concat(arr); }
    function fStr(f, s) {
      const a = [];
      for (let i = 0; i < s.length; i++) a.push(s.charCodeAt(i));
      return fBytes(f, a);
    }
    function place(code) { return fVar(1, 1).concat(fStr(2, code)); }
    function leg(date, frm, to, al) {
      return fStr(2, date).concat(fVar(5, 0)).concat(fStr(6, al))
        .concat(fBytes(13, place(frm))).concat(fBytes(14, place(to)));
    }
    function gf(from, to, air) {
      const al = AIR[air] || "VY";
      let msg = fVar(1, 28).concat(fVar(2, 2));
      msg = msg.concat(fBytes(3, leg("2026-12-04", from, to, al)));
      msg = msg.concat(fBytes(3, leg("2026-12-08", to, from, al)));
      msg = msg.concat(fVar(8, 1)).concat(fVar(8, 1)).concat(fVar(9, 1));
      msg = msg.concat(fBytes(13, fVar(2, 2).concat(fVar(3, 0))));
      msg = msg.concat(fVar(14, 1)).concat(fVar(19, 1));
      const tfs = btoa(String.fromCharCode.apply(null, msg)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      const hl = lang === "de" ? "de" : lang === "en" ? "en" : "es";
      return "https://www.google.com/travel/flights/search?tfs=" + tfs + "&hl=" + hl + "&curr=EUR";
    }
    function kayak(from, to, air) {
      const host = lang === "de" ? "www.kayak.de" : lang === "en" ? "www.kayak.com" : "www.kayak.es";
      const code = AIR[air] || "VY";
      return "https://" + host + "/flights/" + from + "-" + to + "/2026-12-04/2026-12-08/2adults?sort=bestflight_a&fs=stops=~0;airlines=~" + code + ";cabin=~e";
    }
    function stayUrls(c) {
      const max = c.max;
      const bb = c.q.bb;
      const ab = (lang === "de" ? "https://www.airbnb.de" : lang === "en" ? "https://www.airbnb.com" : "https://www.airbnb.es") +
        "/s/" + c.q.airbnb + "/homes?query=" + encodeURIComponent(c.q.ss) +
        "&checkin=2026-12-04&checkout=2026-12-08&adults=6&min_bedrooms=3&min_beds=3&min_bathrooms=2" +
        "&room_types%5B%5D=Entire%20home%2Fapt&price_max=" + max +
        "&price_filter_num_nights=4&date_picker_type=calendar&search_type=user_map_move&source=structured_search_input_header&refinement_paths%5B%5D=%2Fhomes&tab_id=home_tab" +
        "&search_by_map=true&sw_lat=" + bb[0] + "&sw_lng=" + bb[1] + "&ne_lat=" + bb[2] + "&ne_lng=" + bb[3];
      const page = lang === "de" ? "de.html" : lang === "en" ? "html" : "es.html";
      const ss = encodeURIComponent(c.q.ss);
      const occ = "&checkin=2026-12-04&checkout=2026-12-08&group_adults=6&req_adults=6&no_rooms=3&req_rooms=3&group_children=0&req_children=0&selected_currency=EUR";
      const where = "?ss=" + ss + "&ssne=" + ss + "&ssne_untouched=" + ss + "&dest_id=" + c.q.dest + "&dest_type=city" + occ;
      const nfltHt = "ht_id%3D204%3Broomfacility%3D38";
      const ht = "https://www.booking.com/searchresults." + page + where + "&nflt=" + nfltHt + "&order=price&sb=1";
      return { airbnb: ab, hotel: ht };
    }

    function pinIcon(txt, origin, on) {
      return L.divIcon({
        className: "",
        html: "<div class=\"pin" + (origin ? " origin" : "") + (on ? " on" : "") + "\">" + txt + "</div>",
        iconSize: [28, 28], iconAnchor: [14, 14]
      });
    }
    function ensureMap() {
      if (map) return;
      map = L.map("map", { scrollWheelZoom: true }).setView([46.2, 8], 4);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "&copy; OpenStreetMap" }).addTo(map);
      overlay = L.layerGroup().addTo(map);
      const pts = Object.values(ORIGIN).map((o) => o.ll).concat(CITIES.map((c) => c.ll));
      map.fitBounds(pts, { padding: [28, 28], maxZoom: 4 });
    }
    function drawMap() {
      ensureMap();
      overlay.clearLayers();
      const dest = city();
      Object.keys(ORIGIN).forEach((k) => {
        L.marker(ORIGIN[k].ll, { icon: pinIcon(k, true, false) }).addTo(overlay).bindTooltip(k);
        L.polyline([ORIGIN[k].ll, dest.ll], { color: "#c24b1f", weight: 2, opacity: .7, dashArray: "6 6" }).addTo(overlay);
      });
      CITIES.forEach((c) => {
        L.marker(c.ll, { icon: pinIcon(c.iata, false, c.id === sel) })
          .addTo(overlay).bindTooltip(c.name[lang])
          .on("click", () => { sel = c.id; open = c.id; render(); });
      });
      setTimeout(() => map.invalidateSize(), 80);
    }

    function euro(n) { return n + " €"; }
    function splitBox(c, t) {
      const bed = bedOf(c);
      const eat = foodDay * NIGHTS;
      const bedLbl = c.stay <= c.hotel ? t.ab : t.ht;
      return "<div class=\"split\">" + ["BCN", "FRA", "HAM"].map((o) => {
        const fly = flyP(c.flights[o]);
        return "<div class=\"bill\">" +
          "<div class=\"o\">" + ORIGIN[o].name[lang] + " · " + o + "<small>" + t.ppx + "</small></div>" +
          "<div class=\"line\"><span>" + t.fly + "</span><b>" + euro(fly) + "</b></div>" +
          "<hr>" +
          "<div class=\"line\"><span>" + t.bed + " · " + bedLbl + "</span><b>" + t.from + " " + euro(bed) + "</b></div>" +
          "<div class=\"line\"><span>" + t.eat + " <em>" + t.est + "</em></span><b>" + euro(eat) + "</b></div>" +
          "<hr>" +
          "<div class=\"line totline\"><span>" + t.tot + " · " + t.each + "</span><strong>" + t.from + " " + euro(fly + bed + eat) + "</strong></div>" +
          "</div>";
      }).join("") + "</div>";
    }
    function flyRow(c, o, t) {
      const f = c.flights[o];
      return "<div class=\"rowf\"><div class=\"o\">" + o + "</div><div>" +
        "<div class=\"meta\">" + f.air + " · <span class=\"price\">" + euro(flyP(f)) + " " + t.each + "</span> · " + euro(flyP(f) * 2) + " " + t.pair + "</div>" +
        "<div class=\"leg\"><em>" + t.out + "</em>" + f.out[0] + " " + o + " → " + f.out[1] + " " + c.iata + " · " + f.out[2] + "</div>" +
        "<div class=\"leg\"><em>" + t.back + "</em>" + f.back[0] + " " + c.iata + " → " + f.back[1] + " " + o + " · " + f.back[2] + "</div>" +
        "</div><div class=\"btns\"><a class=\"btn\" target=\"_blank\" rel=\"noopener\" href=\"" + gf(o, c.iata, f.air) + "\">" + t.gf + "</a>" +
        "<a class=\"btn ghost\" target=\"_blank\" rel=\"noopener\" href=\"" + kayak(o, c.iata, f.air) + "\">" + t.air + " · " + f.air + "</a></div></div>";
    }

    function render() {
      const t = T[lang];
      document.documentElement.lang = lang;
      document.title = t.dates;
      document.getElementById("dates").textContent = t.dates;
      document.getElementById("title").textContent = t.title;
      document.getElementById("lead").innerHTML = t.lead;
      document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
      document.getElementById("legend").innerHTML =
        "<span><i style=\"background:#1f4e68\"></i>" + t.mapO + "<i style=\"background:#c24b1f\"></i>" + t.mapD + "</span>";
      document.getElementById("foodLbl").textContent = t.foodL;
      document.getElementById("foodVal").textContent = foodDay + " €";
      document.getElementById("stayhint").textContent = t.bud + " " + t.stay;
      document.getElementById("updated").innerHTML = t.upd;

      document.getElementById("list").innerHTML = CITIES.slice().sort((a, b) => a.rank - b.rank).map((x) => {
        const u = stayUrls(x);
        const isOpen = open === x.id;
        const btn = (kind, label, sub) => {
          const miss = x.empty && x.empty[kind];
          const cheap = (kind === "airbnb" && x.stay <= x.hotel) || (kind === "hotel" && x.hotel < x.stay);
          return "<a class=\"" + (cheap ? "on" : "") + (miss ? " miss" : "") + "\" data-stay=\"" + kind +
            "\" data-city=\"" + x.id + "\" target=\"_blank\" rel=\"noopener\" href=\"" + u[kind] + "\"" +
            (miss ? " title=\"" + t.zero + "\"" : "") + ">" + label +
            (sub ? "<span class=\"from\">" + sub + "</span>" : "") +
            (miss ? " · " + t.zero : "") + "</a>";
        };
        const extra = isOpen
          ? "<div class=\"more\">" + splitBox(x, t) + "<p class=\"why\"><strong>" + t.whyL + ".</strong> " + x.why[lang] + "</p>" +
            ["BCN", "FRA", "HAM"].map((o) => flyRow(x, o, t)).join("") +
            "<div style=\"font-size:.72rem;color:var(--mute)\">" + t.bag + "</div></div>"
          : "";
        const tots = ["BCN", "FRA", "HAM"].map((o) => pp(x, o));
        const flies = ["BCN", "FRA", "HAM"].map((o) => flyP(x.flights[o]));
        const lo = Math.min.apply(null, tots);
        const hi = Math.max.apply(null, tots);
        const ppAmt = lo === hi ? euro(lo) : lo + "–" + euro(hi);
        const cheapBed = x.stay <= x.hotel
          ? "<span>" + t.ab + " <b>" + euro(x.stay) + "</b></span>"
          : "<span>" + t.ht + " <b>" + euro(x.hotel) + "</b></span>";
        return "<div class=\"city" + (x.id === sel ? " on" : "") + (isOpen ? " open" : "") + "\" data-id=\"" + x.id + "\">" +
        "<b>#" + x.rank + " " + x.name[lang] + "</b><span>" + x.t + " · " + x.area[lang] + "</span>" +
        "<div class=\"p\"><small>" + t.from + "</small>" + ppAmt + " <small>" + t.each + "</small><span class=\"vary\">" + t.vary + "</span></div>" +
        "<div class=\"grp\">" + t.tot6 + " <b>" + euro(groupOf(x)) + "</b></div>" +
        "<div class=\"brk\"><span>" + t.fly + " <b>" + Math.min.apply(null, flies) + "–" + euro(Math.max.apply(null, flies)) + "</b></span>" +
        cheapBed +
        "<span>" + t.eat + " <b>" + euro(foodDay * NIGHTS) + "</b> <em>" + t.est + "</em></span></div>" +
        "<div class=\"sbtn\">" + btn("airbnb", t.ab, t.from + " " + euro(x.stay)) + btn("hotel", t.ht, t.from + " " + euro(x.hotel)) + "</div>" +
        "<button type=\"button\" class=\"tog\" data-open=\"" + x.id + "\" aria-expanded=\"" + isOpen + "\">" +
        (isOpen ? t.hide : t.det) + "</button>" + extra + "</div>";
      }).join("");

      document.querySelectorAll(".city").forEach((el) => el.onclick = () => { sel = el.dataset.id; render(); });
      document.querySelectorAll(".tog").forEach((b) => {
        b.onclick = (e) => {
          e.stopPropagation();
          const id = b.dataset.open;
          open = open === id ? "" : id;
          sel = id;
          render();
        };
      });
      document.querySelectorAll(".more").forEach((el) => { el.onclick = (e) => e.stopPropagation(); });
      document.querySelectorAll(".sbtn a, .more a").forEach((a) => {
        a.onclick = (e) => {
          e.stopPropagation();
          if (a.dataset.stay) sel = a.dataset.city;
        };
      });
      drawMap();
    }

    document.getElementById("foodIn").oninput = function () { foodDay = +this.value; render(); };
    document.querySelectorAll("[data-lang]").forEach((b) => {
      b.onclick = () => { lang = b.dataset.lang; setLangUrl(lang); render(); };
    });
    render();
  </script>
