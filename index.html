<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4–8 Dec 2026</title>
  <style>
    :root {
      --ink: #17202a;
      --mute: #5a6570;
      --line: #e4d8c8;
      --paper: #f3ebe0;
      --card: #fffcf7;
      --sea: #1f4e68;
      --clay: #c24b1f;
      --gold: #c9a227;
      --ok: #2c6b4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.45;
    }
    .bar {
      position: sticky; top: 0; z-index: 5;
      display: flex; justify-content: space-between; align-items: center;
      gap: .8rem; flex-wrap: wrap;
      padding: .7rem 1.2rem;
      background: rgba(243,235,224,.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 750; letter-spacing: .02em; }
    .langs, .stay, .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
    button.pill, a.btn {
      font: inherit; cursor: pointer; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
      padding: .32rem .72rem;
    }
    button.pill[aria-pressed="true"] {
      background: var(--sea); color: #fff; border-color: var(--sea);
    }
    a.btn {
      text-decoration: none; background: var(--ink); color: #fff; border: 0;
      display: inline-block; border-radius: 8px; padding: .42rem .75rem;
    }
    a.btn.alt { background: var(--sea); }
    .wrap { max-width: 76rem; margin: 0 auto; padding: 1.1rem 1.15rem 2.4rem; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.6rem, 3.2vw, 2.35rem); margin: 0 0 .4rem; font-weight: 600; }
    .lead { max-width: 46rem; color: var(--mute); margin: 0 0 1rem; }
    .chips span {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 999px; padding: .28rem .7rem; font-size: .88rem;
    }
    .grid {
      display: grid; grid-template-columns: 1.05fr .95fr; gap: 1rem; margin-top: 1rem;
    }
    .panel, .mapbox, .city {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    }
    .mapbox { padding: .7rem .7rem .4rem; }
    svg.map { width: 100%; height: auto; display: block; }
    .dot { cursor: pointer; }
    .dot circle { stroke: #fff; stroke-width: 2; }
    .dot text { font-size: 11px; font-family: inherit; fill: var(--ink); font-weight: 700; }
    .legend { display: flex; gap: .8rem; font-size: .78rem; color: var(--mute); padding: .2rem .4rem .55rem; }
    .legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; margin-right: .25rem; vertical-align: -1px; }
    .panel { padding: 1rem 1.05rem 1.1rem; }
    .k { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--clay); font-weight: 700; }
    .temp { font-size: 1.05rem; font-weight: 700; color: var(--sea); }
    .why { color: var(--mute); margin: .35rem 0 .85rem; }
    .leg {
      border: 1px solid var(--line); border-radius: 12px; padding: .75rem .8rem; margin: .55rem 0;
    }
    .leg h3 { margin: 0 0 .45rem; font-size: .95rem; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
    .fly {
      background: #f7f1e8; border-radius: 10px; padding: .55rem .6rem; font-size: .86rem;
    }
    .fly b { display: block; font-size: .78rem; color: var(--mute); font-weight: 650; }
    .times { font-size: 1.05rem; font-weight: 750; margin: .15rem 0; }
    .times span { color: var(--mute); font-weight: 600; font-size: .9rem; }
    .price { color: var(--clay); font-weight: 750; }
    .staybox { font-size: .92rem; margin: .7rem 0 .2rem; }
    .links { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .75rem; }
    .list { display: grid; gap: .55rem; margin-top: 1rem; }
    .city { padding: .75rem .9rem; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: .7rem; align-items: center; }
    .city.on { outline: 2px solid var(--clay); }
    .n { width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--sea); color: #fff; display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
    .city.on .n { background: var(--clay); }
    footer { max-width: 76rem; margin: 0 auto; padding: 0 1.15rem 2rem; color: var(--mute); font-size: .84rem; }
    footer a { color: inherit; }
    @media (max-width: 900px) {
      .grid, .pair { grid-template-columns: 1fr; }
    }
  </style>
</head>

    function render() {
      const t = T[lang];

      document.getElementById("stay").innerHTML = [

      }).join("");
      document.getElementById("arcs").innerHTML = arcs;

      const marks = Object.values(ORIGIN).map((o) =>
        "<g><circle cx=\"" + o.xy[0] + "\" cy=\"" + o.xy[1] + "\" r=\"7\" fill=\"#1f4e68\"/><text x=\"" + (o.xy[0] + 10) + "\" y=\"" + (o.xy[1] + 4) + "\">" + o.label + "</text></g>"
      ).join("") + CITIES.map((c) =>
        "<g class=\"dot\" data-id=\"" + c.id + "\"><circle cx=\"" + c.xy[0] + "\" cy=\"" + c.xy[1] + "\" r=\"" + (c.id === sel ? 9 : 7) + "\" fill=\"#c24b1f\"/><text x=\"" + (c.xy[0] + 10) + "\" y=\"" + (c.xy[1] + 4) + "\">" + c.name[lang] + "</text></g>"
      ).join("");
      document.getElementById("markers").innerHTML = marks;

      const c = city();
      const share = Math.round(c.stay[stay] / 6);
      document.getElementById("detail").innerHTML =
        "<div class=\"k\">#" + c.rank + " · " + t.pick + "</div>" +
        "<h2 style=\"margin:.2rem 0 0;font-family:Georgia,serif\">" + c.name[lang] + " (" + c.iata + ")</h2>" +
        "<div class=\"temp\">" + c.t + "</div>" +
        "<p class=\"why\">" + c.why[lang] + "</p>" +
        ["BCN", "FRA", "HAM"].map((o) => flyBlock(c, o, t)).join("") +
        "<p class=\"staybox\"><strong>" + t.area + ":</strong> " + c.area[lang] + "<br>" +
        "<strong>" + t.nights + ":</strong> " + c.stay[stay] + " € → " + share + " € " + t.pay + "<br>" +
        "<strong>" + t.food + ":</strong> " + c.food[lang] + " → " + c.food.total + " € · " + t.foodInc + "<br>" +
        "<strong>" + t.metro + ":</strong> " + c.metro + " €</p>" +
        "<div class=\"links\"><a class=\"btn alt\" href=\"" + stayUrl(c) + "\">" + t.ab + "</a></div>";

      document.getElementById("list").innerHTML = CITIES.map((x) =>
        "<div class=\"city" + (x.id === sel ? " on" : "") + "\" data-id=\"" + x.id + "\">" +
        "<div class=\"n\">" + x.rank + "</div><div><strong>" + x.name[lang] + "</strong> · " + x.t +
        "<div class=\"why\" style=\"margin:0\">" + x.why[lang] + "</div></div>" +
        "<div class=\"price\">" + pp(x, "BCN") + "–" + pp(x, "FRA") + " €</div></div>"
      ).join("");

      document.querySelectorAll("[data-stay]").forEach((b) => b.onclick = () => { stay = b.dataset.stay; render(); });
      document.querySelectorAll(".dot, .city").forEach((el) => el.onclick = () => { sel = el.dataset.id; render(); });
    }

    document.querySelectorAll("[data-lang]").forEach((b) => {
      b.onclick = () => { lang = b.dataset.lang; localStorage.setItem("trip-lang", lang); render(); };
    });
    render();
  </script>
</body>
</html>
