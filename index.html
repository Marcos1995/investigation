    .langs, .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
    button.pill, a.btn {

      border: 1px solid var(--line); background: var(--card); color: var(--ink);
      padding: .32rem .72rem;
    }
    button.pill[aria-pressed="true"] {
      background: var(--sea); color: #fff; border-color: var(--sea);
    }
    a.btn {
      text-decoration: none; background: var(--ink); color: #fff; border: 0;
      display: inline-block; border-radius: 8px; padding: .48rem .8rem;
    }
    a.btn.alt { background: var(--sea); }
    a.btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }

    .lead { max-width: 48rem; color: var(--mute); margin: 0 0 1rem; }
    .chips span {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 999px; padding: .28rem .7rem; font-size: .88rem;
    }
    .staygrid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: .7rem; margin: .7rem 0 1rem;
    }
    .staycard {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: .85rem .9rem; cursor: pointer; text-align: left;
    }
    .staycard.on { outline: 2px solid var(--clay); }
    .staycard h3 { margin: 0 0 .25rem; font-size: 1rem; }
    .staycard p { margin: 0 0 .65rem; color: var(--mute); font-size: .86rem; }
    .staycard .eur { font-weight: 750; color: var(--clay); margin-bottom: .55rem; }
    .grid { display: grid; grid-template-columns: 1.08fr .92fr; gap: 1rem; }
    .panel, .mapbox, .city {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    }
    .mapbox { overflow: hidden; }
    #map { height: 420px; width: 100%; }
    .legend { display: flex; gap: .8rem; font-size: .78rem; color: var(--mute); padding: .45rem .7rem .6rem; }
    .legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; margin-right: .25rem; vertical-align: -1px; }
    .panel { padding: 1rem 1.05rem 1.1rem; max-height: 520px; overflow: auto; }
    .k { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--clay); font-weight: 700; }
    .temp { font-size: 1.05rem; font-weight: 700; color: var(--sea); }
    .why { color: var(--mute); margin: .35rem 0 .85rem; }
    .leg { border: 1px solid var(--line); border-radius: 12px; padding: .75rem .8rem; margin: .55rem 0; }
    .leg h3 { margin: 0 0 .45rem; font-size: .95rem; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
    .fly { background: #f7f1e8; border-radius: 10px; padding: .55rem .6rem; font-size: .86rem; }
    .fly b { display: block; font-size: .78rem; color: var(--mute); font-weight: 650; }
    .times { font-size: 1.05rem; font-weight: 750; margin: .15rem 0; }
    .times span { color: var(--mute); font-weight: 600; font-size: .9rem; }
    .price { color: var(--clay); font-weight: 750; }
    .staybox { font-size: .92rem; margin: .7rem 0 .2rem; }
    .links { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .7rem; }
    .list { display: grid; gap: .55rem; margin-top: 1rem; }
    .city { padding: .75rem .9rem; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: .7rem; align-items: center; }
    .city.on { outline: 2px solid var(--clay); }
    .n { width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--sea); color: #fff; display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
    .city.on .n { background: var(--clay); }
    .pin { background: var(--clay); color: #fff; border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; font-size: 10px; font-weight: 800; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
    .pin.origin { background: var(--sea); }

    footer { max-width: 76rem; margin: 0 auto; padding: 0 1.15rem 2rem; color: var(--mute); font-size: .84rem; }
    footer a { color: inherit; }
    @media (max-width: 900px) {
      .grid, .pair, .staygrid { grid-template-columns: 1fr; }
      #map { height: 300px; }

        "/s/" + c.q.airbnb + "/homes?checkin=2026-12-04&checkout=2026-12-08&adults=6&min_bedrooms=3";
      const page = lang === "de" ? "de.html" : lang === "en" ? "html" : "es.html";
      const apt = "https://www.booking.com/searchresults." + page + "?ss=" + encodeURIComponent(c.q.apt) +
        "&checkin=2026-12-04&checkout=2026-12-08&group_adults=6&no_rooms=1&nflt=ht_id%3D201";
      const ht = "https://www.booking.com/searchresults." + page + "?ss=" + encodeURIComponent(c.q.hotel) +
        "&checkin=2026-12-04&checkout=2026-12-08&group_adults=6&no_rooms=3";
      return { airbnb: ab, apt: apt, hotel: ht };
    }

    function pinIcon(txt, origin, on) {
      return L.divIcon({
        className: "",
        html: "<div class=\"pin" + (origin ? " origin" : "") + (on ? " on" : "") + "\">" + txt + "</div>",
        iconSize: [28, 28], iconAnchor: [14, 14]
      });
    }

    function ensureMap() {
      if (map) return;
      map = L.map("map", { scrollWheelZoom: false, worldCopyJump: true }).setView([46.2, 6.1], 4);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "&copy; OpenStreetMap"
      }).addTo(map);
      overlay = L.layerGroup().addTo(map);
      map.on("click", () => map.scrollWheelZoom.enable());
    }

    function drawMap() {
      ensureMap();
      overlay.clearLayers();
      const dest = city();
      Object.keys(ORIGIN).forEach((k) => {
        const o = ORIGIN[k];
        L.marker(o.ll, { icon: pinIcon(k, true, false), keyboard: false })
          .addTo(overlay).bindTooltip(k);
        L.polyline([o.ll, dest.ll], { color: "#c24b1f", weight: 2, opacity: .75, dashArray: "6 6" }).addTo(overlay);
      });
      CITIES.forEach((c) => {
        L.marker(c.ll, { icon: pinIcon(c.iata, false, c.id === sel) })
          .addTo(overlay)
          .bindTooltip(c.name[lang] + " " + c.t)
          .on("click", () => { sel = c.id; render(); });
      });
      const pts = Object.values(ORIGIN).map((o) => o.ll).concat([dest.ll]);
      map.fitBounds(pts, { padding: [28, 28], maxZoom: 5 });
      setTimeout(() => map.invalidateSize(), 80);
    }

    function flyBlock(c, o, t) {
      const f = c.flights[o];
      const row = (tag, a, b, d) =>
        "<div class=\"fly\"><b>" + tag + "</b><div class=\"times\">" + a + " " + o + " <span>→</span> " + b + " " + c.iata + "</div>" +
        t.dep + " " + a + " · " + t.arr + " " + b + " · " + d + " " + t.dur + "</div>";
      return "<div class=\"leg\"><h3>" + t.pax + " · " + o + " · " + f.air + " · <span class=\"price\">" + f.p + " € " + t.each + "</span></h3>" +
        "<div class=\"pair\">" + row(t.out, f.out[0], f.out[1], f.out[2]) +
        "<div class=\"fly\"><b>" + t.back + "</b><div class=\"times\">" + f.back[0] + " " + c.iata + " <span>→</span> " + f.back[1] + " " + o + "</div>" +
        t.dep + " " + f.back[0] + " · " + t.arr + " " + f.back[1] + " · " + f.back[2] + " " + t.dur + "</div></div>" +
        "<div class=\"links\">" +
        "<a class=\"btn\" target=\"_blank\" rel=\"noopener\" href=\"" + gf(o, c.iata) + "\">" + t.gf + "</a>" +
        "<a class=\"btn ghost\" target=\"_blank\" rel=\"noopener\" href=\"" + airlineUrl(f.air, o, c.iata) + "\">" + t.air + " " + f.air + "</a>" +
        "</div></div>";
    }

    function render() {
      const t = T[lang];
      const c = city();
      const urls = stayUrls(c);
      const share = (k) => Math.round(c.stay[k] / 6);
      document.documentElement.lang = lang;
      document.title = t.title;
      document.getElementById("title").textContent = t.title;
      document.getElementById("lead").textContent = t.lead;
      document.getElementById("who").innerHTML = t.who.map((w) => "<span>" + w + "</span>").join("");
      document.getElementById("stayLabel").textContent = t.stay;
      document.getElementById("stay").innerHTML = [
        ["airbnb", t.airbnb, t.teach.airbnb, t.openAb],
        ["apt", t.apt, t.teach.apt, t.openApt],
        ["hotel", t.hotel, t.teach.hotel, t.openHt]
      ].map(([k, lab, teach, open]) =>
        "<article class=\"staycard" + (stay === k ? " on" : "") + "\" data-stay=\"" + k + "\">" +
        "<h3>" + lab + "</h3><p>" + teach + "</p>" +
        "<div class=\"eur\">" + c.stay[k] + " € · " + t.nights + " → " + share(k) + " € " + t.each + "</div>" +
        "<a class=\"btn alt\" target=\"_blank\" rel=\"noopener\" href=\"" + urls[k] + "\">" + open + "</a></article>"
      ).join("");
      document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
      document.getElementById("legend").innerHTML =
        "<span><i style=\"background:#1f4e68\"></i>" + t.mapO + "</span><span><i style=\"background:#c24b1f\"></i>" + t.mapD + "</span><span>" + t.legend + "</span>";
      document.getElementById("foot").innerHTML = t.note + ' <a href="https://github.com/Marcos1995/investigation">https://github.com/Marcos1995/investigation</a>';

      document.getElementById("detail").innerHTML =
        "<div class=\"k\">#" + c.rank + " · " + t.pick + "</div>" +
        "<h2 style=\"margin:.2rem 0 0;font-family:Georgia,serif\">" + c.name[lang] + " (" + c.iata + ")</h2>" +
        "<div class=\"temp\">" + c.t + "</div>" +
        "<p class=\"why\">" + c.why[lang] + "</p>" +
        ["BCN", "FRA", "HAM"].map((o) => flyBlock(c, o, t)).join("") +
        "<p class=\"staybox\"><strong>" + t.area + ":</strong> " + c.area[lang] + "<br>" +
        "<strong>" + t.food + ":</strong> " + c.food[lang] + " → " + c.food.total + " € · " + t.foodInc + "<br>" +
        "<strong>" + t.metro + ":</strong> " + c.metro + " €</p>";

      document.getElementById("list").innerHTML = CITIES.map((x) =>
        "<div class=\"city" + (x.id === sel ? " on" : "") + "\" data-id=\"" + x.id + "\">" +
        "<div class=\"n\">" + x.rank + "</div><div><strong>" + x.name[lang] + "</strong> · " + x.t +
        "<div class=\"why\" style=\"margin:0\">" + x.why[lang] + "</div></div>" +
        "<div class=\"price\">" + pp(x, "BCN") + "–" + pp(x, "FRA") + " €</div></div>"
      ).join("");

      document.querySelectorAll(".staycard").forEach((b) => {
        b.onclick = (e) => {
          if (e.target.closest("a")) return;
          stay = b.dataset.stay;
          render();
        };
      });
      document.querySelectorAll(".city").forEach((el) => el.onclick = () => { sel = el.dataset.id; render(); });
      drawMap();
    }

    document.querySelectorAll("[data-lang]").forEach((b) => {
      b.onclick = () => { lang = b.dataset.lang; localStorage.setItem("trip-lang", lang); render(); };
    });
    render();
  </script>
</body>
</html>
